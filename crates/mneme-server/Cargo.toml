[package]
name = "mneme-server"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "mneme"
path = "src/main.rs"

[features]
default = ["ollama"]
# When enabled, the server can host the real `OllamaLlmClient` for the
# evolution worker. Toggle off (via `--no-default-features`) for CI /
# slim builds that don't need the HTTP dependency tree — the worker
# transparently falls back to `DemoLlmClient`.
ollama = ["mneme-llm/ollama"]
# Use the real, audited crypto behind the existing seams instead of the offline
# stand-ins: ChaCha20-Poly1305 for the KV crypto-shred keyring (`aead`) and
# ed25519 signatures for the skill-exchange certificate (`ed25519`). Default
# keeps XorCipher / FakeSigner so the dep tree stays light.
aead = ["mneme-privacy/aead"]
ed25519 = ["mneme-exchange/ed25519"]

[dependencies]
mneme-core.workspace = true
mneme-store.workspace = true
mneme-index.workspace = true
mneme-graph.workspace = true
mneme-extract.workspace = true
mneme-privacy.workspace = true
mneme-evolve.workspace = true
mneme-llm = { workspace = true, default-features = false }
mneme-procedural.workspace = true
mneme-causal.workspace = true
mneme-probe.workspace = true
mneme-kv.workspace = true
mneme-exchange.workspace = true
mneme-dream.workspace = true
mneme-provenance.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
axum.workspace = true
tower-http.workspace = true
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
time.workspace = true
