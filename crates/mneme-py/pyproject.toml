[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[project]
name = "mneme"
# Version is sourced from Cargo.toml via maturin — we don't duplicate
# it here.
dynamic = ["version"]
description = "Self-improving long-term memory layer for AI agents"
readme = "../../README.md"
license = { text = "Apache-2.0" }
authors = [
    { name = "Aniket Shukla", email = "aniketshukla619@gmail.com" }
]
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/aniketshukla1/mneme"
Repository = "https://github.com/aniketshukla1/mneme"

[tool.maturin]
# Bind the package to the cdylib target. maturin will produce a
# `mneme/_mneme.so` (or .pyd on Windows) inside the wheel.
module-name = "mneme._mneme"
python-source = "python"
# Tell maturin which feature to enable on the Rust crate when
# building the wheel.
features = ["pyo3/extension-module"]
