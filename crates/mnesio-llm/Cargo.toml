[package]
name = "mnesio-llm"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "LlmClient implementations for mnesio: Fake (deterministic, dep-free) + Ollama (local HTTP backend)."
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"

[features]
# `ollama` pulls in reqwest + serde_json so callers that don't need the
# real backend (CI tests, embeddings-only builds) stay light. Default-on
# so `cargo build` from the workspace root gets the full client.
default = ["ollama"]
ollama = ["dep:reqwest", "dep:serde_json"]
# `openai` adds an OpenAI-compatible chat client (OpenRouter / OpenAI / any
# `/v1/chat/completions` gateway). Same reqwest + serde_json dep tree as
# `ollama`. Off by default so lean builds stay HTTP-free; the bench binary
# turns it on to run the published LoCoMo / LongMemEval numbers.
openai = ["dep:reqwest", "dep:serde_json"]

[dependencies]
mnesio-core.workspace = true
async-trait.workspace = true
tracing.workspace = true
anyhow.workspace = true
serde = { workspace = true, features = ["derive"] }
tokio.workspace = true
reqwest = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
