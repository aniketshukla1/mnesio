[package]
name = "mneme-exchange"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
mneme-core = { workspace = true }
mneme-procedural = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Real ed25519 signatures behind the `Signer` trait. Optional + feature-gated
# so the default build stays dependency-free (FakeSigner is the offline default).
ed25519-dalek = { version = "2", optional = true }

[features]
# Enables the real ed25519 signer (`Ed25519Signer`). The export/verify/re-gate
# protocol is identical; this makes the signatures cryptographically real.
ed25519 = ["dep:ed25519-dalek"]

[dev-dependencies]
tokio = { workspace = true }
