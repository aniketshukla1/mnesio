[package]
name = "mnesio-kv"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Gated KV cartridges for mnesio — the KV cache as a rebuildable materialized view."
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"

[dependencies]
mnesio-core = { workspace = true }
mnesio-privacy = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# `pretrained-kv`: load real open-weights (GPT-2) — token embeddings + the
# layer-0 c_attn Q/K/V projection — and compute a real pretrained KV cache.
# safetensors parses the weights, tokenizers does GPT-2 BPE, hf-hub downloads +
# caches the files. All optional so the default build stays light + offline.
safetensors = { version = "0.5", optional = true }
tokenizers = { version = "0.23", optional = true }
hf-hub = { version = "0.5", optional = true }
anyhow = { workspace = true, optional = true }
# `candle-kv`: GPU-accelerated (Metal) forward for the modern-model cartridge.
# candle owns real Metal kernels; the metal feature pulls metal-rs + kernels.
candle-core = { version = "0.10", optional = true }
candle-nn = { version = "0.10", optional = true }

[features]
pretrained-kv = ["dep:safetensors", "dep:tokenizers", "dep:hf-hub", "dep:anyhow"]
# Full GPT-2 forward + generation with a serializable KV cache (the cartridge
# literally *is* the cache). Heavier than `pretrained-kv` (all 12 layers + a
# generation loop); same optional deps.
generative-kv = ["dep:safetensors", "dep:tokenizers", "dep:hf-hub", "dep:anyhow"]
# A modern open-weights model (Qwen2.5-0.5B-Instruct) behind the same cartridge
# path: RMSNorm + RoPE + grouped-query attention + SwiGLU, bf16 weights. The
# honest "more advanced model than GPT-2" answer — pure-Rust forward so the
# cartridge owns the KV cache (Ollama's API can't expose it); same optional deps.
qwen-kv = ["dep:safetensors", "dep:tokenizers", "dep:hf-hub", "dep:anyhow"]
# GPU-accelerated (Metal/CUDA) Qwen2 forward via candle — the same cartridge
# semantics as `qwen-kv` but batched on-device; the pure-Rust `qwen-kv` backend
# is its correctness oracle. `metal` enables Apple-GPU kernels (falls back to CPU
# elsewhere). Heaviest feature; default build is unaffected.
candle-kv = [
    "dep:candle-core",
    "dep:candle-nn",
    "dep:safetensors",
    "dep:tokenizers",
    "dep:hf-hub",
    "dep:anyhow",
]
metal = ["candle-core?/metal", "candle-nn?/metal"]

[dev-dependencies]
tokio = { workspace = true }
