[package]
name = "mneme-privacy"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
mneme-core.workspace = true
serde.workspace = true
tracing.workspace = true
# Real authenticated AEAD behind the `Cipher` trait. Optional + feature-gated
# so the default build stays dependency-free (XorCipher is the offline default).
chacha20poly1305 = { version = "0.10", optional = true }

[features]
# Enables the real ChaCha20-Poly1305 AEAD cipher (`ChaChaCipher`). The
# crypto-shred forget guarantee is identical either way (it's key destruction);
# this adds authenticated, tamper-resistant encryption for production.
aead = ["dep:chacha20poly1305"]
