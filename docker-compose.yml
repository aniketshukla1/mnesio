# One command to run mnesio with no Rust toolchain installed:
#
#     docker compose up --build
#
# Then open the live dashboard at http://localhost:7777.
services:
  mnesio:
    build: .
    image: mnesio:local
    ports:
      - "7777:7777"
    environment:
      # Bind all interfaces inside the container so the published port works.
      MNESIO_HOST: "0.0.0.0"
      # Instant-demo defaults — zero external downloads on first boot.
      MNESIO_DEMO: "1"
      MNESIO_EMBEDDER: "mock"
      MNESIO_PROCEDURAL: "on"
      RUST_LOG: "info"
      # --- For real, persistent use: set MNESIO_DEMO to "0" and MNESIO_EMBEDDER
      #     to "fastembed" (downloads bge-small-en-v1.5 on first run). The log
      #     then persists in the named volume below across restarts. ---
    volumes:
      - mnesio-data:/data

volumes:
  mnesio-data:
