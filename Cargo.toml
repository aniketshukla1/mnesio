[workspace]
resolver = "2"
members = [
    "crates/mneme-core",
    "crates/mneme-store",
    "crates/mneme-index",
    "crates/mneme-graph",
    "crates/mneme-extract",
    "crates/mneme-privacy",
    "crates/mneme-llm",
    "crates/mneme-evolve",
    "crates/mneme-procedural",
    "crates/mneme-causal",
    "crates/mneme-probe",
    "crates/mneme-kv",
    "crates/mneme-exchange",
    "crates/mneme-dream",
    "crates/mneme-provenance",
    "crates/mneme-server",
    "crates/mneme-bench",
    "crates/mneme-mcp",
    "crates/mneme-py",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/aniketshukla1/mneme"
homepage = "https://github.com/aniketshukla1/mneme"
keywords = ["memory", "agents", "llm", "rag", "ai"]
categories = ["database-implementations", "data-structures"]
rust-version = "1.79"

[workspace.dependencies]
# --- internal crates ---
mneme-core = { path = "crates/mneme-core" }
mneme-store = { path = "crates/mneme-store" }
mneme-index = { path = "crates/mneme-index" }
mneme-graph = { path = "crates/mneme-graph" }
mneme-extract = { path = "crates/mneme-extract" }
mneme-privacy = { path = "crates/mneme-privacy" }
mneme-llm = { path = "crates/mneme-llm", default-features = false }
mneme-evolve = { path = "crates/mneme-evolve" }
mneme-procedural = { path = "crates/mneme-procedural" }
mneme-causal = { path = "crates/mneme-causal" }
mneme-probe = { path = "crates/mneme-probe" }
mneme-kv = { path = "crates/mneme-kv" }
mneme-exchange = { path = "crates/mneme-exchange" }
mneme-dream = { path = "crates/mneme-dream" }
mneme-provenance = { path = "crates/mneme-provenance" }
mneme-bench = { path = "crates/mneme-bench" }
mneme-mcp = { path = "crates/mneme-mcp" }
mneme-py = { path = "crates/mneme-py" }

# --- foundation (see architecture report, "Rust Crate Survey") ---
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ulid = { version = "1", features = ["serde"] }
time = { version = "0.3", features = ["serde", "macros"] }
async-trait = "0.1"

# --- storage / index (wrapped, per build plan Phase 0) ---
fjall = "2"
tantivy = "0.22"
hnsw_rs = "0.3"
simsimd = "6"
fastembed = "5"

# --- viz / server (mneme-server only) ---
axum = "0.7"
tower-http = { version = "0.5", features = ["trace"] }

# --- HTTP client (mneme-llm 'ollama' feature only) ---
# `rustls-tls` keeps us off OpenSSL / native cert store, which makes the
# crate trivially buildable on every platform CI runs on.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[profile.release]
lto = "thin"
codegen-units = 1
